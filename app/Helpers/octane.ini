[program:octane]
process_name=%(program_name)s
command=php /var/www/laravel/artisan octane:start --server=frankenphp --host=%(ENV_APPLICATION_NAME)s.apps.uis.edu --port=8000 --log-level=info --workers=2 --max-requests=250
autostart=true
autorestart=true
priority=100
user=www-data
directory=/var/www/laravel
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true
numprocs=1